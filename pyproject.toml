[project]
name = "pdf-to-tables"
version = "0.1.0"
description = "Advent of Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "tqdm>=4.67.1",
    "tabula-py[jpype]",
    "camelot-py",
    "cryptography",
    "ruff",
    "pdfplumber",
    "pymupdf",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'"
]